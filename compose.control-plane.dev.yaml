# Run this file alone; do not combine it with compose.yaml.
# Use a separate Compose project so test commands cannot target the live stream stack.
name: cloudtunes-control-plane-dev
services:
  control-plane-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudtunes_control_plane
      POSTGRES_USER: cloudtunes
      POSTGRES_PASSWORD: cloudtunes-dev-only
    ports: ["127.0.0.1:${CONTROL_PLANE_DB_PORT:-15433}:5432"]
    volumes: ["control-plane-db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudtunes -d cloudtunes_control_plane"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane-migrate:
    build: { context: ./control-plane }
    environment: &control-plane-env
      APP_NAME: CloudTunes Control Plane
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      APP_URL: http://localhost:18080
      CLOUDTUNES_PUBLIC_REGISTRATION_ENABLED: ${CLOUDTUNES_PUBLIC_REGISTRATION_ENABLED:-false}
      ICECAST_STATUS_URL: ${ICECAST_STATUS_URL:-http://host.docker.internal:8000/status-json.xsl}
      ICECAST_PUBLIC_URL: ${ICECAST_PUBLIC_URL:-http://localhost:8000}
      ICECAST_MOUNT: ${ICECAST_MOUNT:-/default0.ogg}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: control-plane-db
      DB_PORT: "5432"
      DB_DATABASE: cloudtunes_control_plane
      DB_USERNAME: cloudtunes
      DB_PASSWORD: cloudtunes-dev-only
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      CACHE_STORE: database
    command: ["php","artisan","migrate","--force"]
    depends_on:
      control-plane-db: { condition: service_healthy }

  control-plane:
    build: { context: ./control-plane }
    environment: *control-plane-env
    command: ["php","-S","0.0.0.0:8080","-t","public","public/index.php"]
    ports: ["18080:8080"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      control-plane-migrate: { condition: service_completed_successfully }
    volumes: ["control-plane-storage:/var/www/control-plane/storage"]

  runtime-controller:
    build: { context: ./runtime-controller }
    restart: unless-stopped
    environment:
      CLOUDTUNES_RUNTIME_SHARED_SECRET: ${CLOUDTUNES_RUNTIME_SHARED_SECRET:-}
      RUNTIME_CONTROLLER_DB: /data/runtime-controller.sqlite3
    expose: ["8090"]
    volumes: ["runtime-controller-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane-worker:
    build: { context: ./control-plane }
    environment:
      <<: *control-plane-env
      CLOUDTUNES_RUNTIME_CONTROLLER_URL: http://runtime-controller:8090
      CLOUDTUNES_RUNTIME_SHARED_SECRET: ${CLOUDTUNES_RUNTIME_SHARED_SECRET:-}
    command: ["php","artisan","queue:work","--sleep=1","--tries=3","--timeout=90"]
    depends_on:
      control-plane-migrate: { condition: service_completed_successfully }
      runtime-controller: { condition: service_healthy }
    volumes: ["control-plane-storage:/var/www/control-plane/storage"]

volumes:
  control-plane-db-data:
    name: cloudtunes-control-plane-dev-db-data
  control-plane-storage:
    name: cloudtunes-control-plane-dev-storage
  runtime-controller-data:
    name: cloudtunes-control-plane-dev-runtime-controller-data
