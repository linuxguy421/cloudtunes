services:
  icecast:
    build:
      context: ./docker-icecast
    restart: unless-stopped
    ports:
      - "\${ICECAST_PORT:-8000}:8000"
    secrets:
      - icecast_source_password
      - icecast_relay_password
      - icecast_admin_password
    volumes:
      - icecast-config:/etc/icecast2
    networks:
      - cloudtunes
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/status-json.xsl || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  ices:
    build:
      context: ./docker-ices
    restart: unless-stopped
    depends_on:
      icecast:
        condition: service_healthy
    secrets:
      - ices_source_password
    volumes:
      - music-data:/data
      - ices-playlists:/etc/ices/playlist
      - ices-config:/etc/ices/config
    networks:
      - cloudtunes

  control-plane-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudtunes_control_plane
      POSTGRES_USER: cloudtunes
      POSTGRES_PASSWORD: \${CONTROL_PLANE_DB_PASSWORD:?Set CONTROL_PLANE_DB_PASSWORD in .env}
    volumes:
      - control-plane-db-data:/var/lib/postgresql/data
    networks:
      - cloudtunes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudtunes -d cloudtunes_control_plane"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane-migrate:
    build:
      context: ./control-plane
    restart: "no"
    environment: &control-plane-env
      APP_NAME: CloudTunes
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: \${CONTROL_PLANE_APP_KEY:?Set CONTROL_PLANE_APP_KEY in .env}
      APP_URL: \${APP_URL:-http://localhost:8080}
      CLOUDTUNES_PUBLIC_REGISTRATION_ENABLED: \${CLOUDTUNES_PUBLIC_REGISTRATION_ENABLED:-true}
      ICECAST_STATUS_URL: http://icecast:8000/status-json.xsl
      ICECAST_PUBLIC_URL: \${ICECAST_PUBLIC_URL:-http://localhost:8000}
      ICECAST_MOUNT: \${ICECAST_MOUNT:-/default0.ogg}
      LASTFM_API_KEY: \${LASTFM_API_KEY:-}
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: pgsql
      DB_HOST: control-plane-db
      DB_PORT: "5432"
      DB_DATABASE: cloudtunes_control_plane
      DB_USERNAME: cloudtunes
      DB_PASSWORD: \${CONTROL_PLANE_DB_PASSWORD:?Set CONTROL_PLANE_DB_PASSWORD in .env}
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: \${SESSION_SECURE_COOKIE:-false}
      CACHE_STORE: database
    command: ["php", "artisan", "migrate", "--force"]
    depends_on:
      control-plane-db:
        condition: service_healthy
    networks:
      - cloudtunes

  control-plane:
    build:
      context: ./control-plane
    restart: unless-stopped
    environment: *control-plane-env
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public", "public/index.php"]
    ports:
      - "\${CONTROL_PLANE_PORT:-8080}:8080"
    volumes:
      - control-plane-storage:/var/www/control-plane/storage
    depends_on:
      control-plane-migrate:
        condition: service_completed_successfully
    networks:
      - cloudtunes

  runtime-controller:
    build:
      context: ./runtime-controller
    restart: unless-stopped
    environment:
      CLOUDTUNES_RUNTIME_SHARED_SECRET: \${CLOUDTUNES_RUNTIME_SHARED_SECRET:-}
      RUNTIME_CONTROLLER_DB: /data/runtime-controller.sqlite3
    expose:
      - "8090"
    volumes:
      - runtime-controller-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cloudtunes

  control-plane-worker:
    build:
      context: ./control-plane
    restart: unless-stopped
    environment:
      <<: *control-plane-env
      CLOUDTUNES_RUNTIME_CONTROLLER_URL: http://runtime-controller:8090
      CLOUDTUNES_RUNTIME_SHARED_SECRET: \${CLOUDTUNES_RUNTIME_SHARED_SECRET:-}
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=90"]
    volumes:
      - control-plane-storage:/var/www/control-plane/storage
    depends_on:
      control-plane-migrate:
        condition: service_completed_successfully
      runtime-controller:
        condition: service_healthy
    networks:
      - cloudtunes

secrets:
  icecast_source_password:
    file: ./secrets/icecast_source_password
  ices_source_password:
    file: ./secrets/ices_source_password
  icecast_relay_password:
    file: ./secrets/icecast_relay_password
  icecast_admin_password:
    file: ./secrets/icecast_admin_password

networks:
  cloudtunes:
    driver: bridge

volumes:
  icecast-config:
  music-data:
  ices-playlists:
  ices-config:
  control-plane-db-data:
  control-plane-storage:
  runtime-controller-data:
